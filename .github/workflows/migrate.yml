name: Apply DB Migrations (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Rama o SHA con las migraciones a aplicar (default: main)"
        required: false
        default: main
        type: string

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Prepare SSH key
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Backup previo (DB + uploads)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" 'bash /usr/local/bin/backup-wolfie.sh'

      - name: Sync prisma (schema + migraciones)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_SSH_PORT -o StrictHostKeyChecking=no" \
            prisma/ "$VPS_USER@$VPS_HOST:/var/www/wolfie-room/prisma/"

      - name: Aplicar migraciones (prisma migrate deploy en el VPS)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            cd /var/www/wolfie-room/tools
            DATABASE_URL="file:/var/www/wolfie-room/data/dev.db" npx prisma migrate deploy
          '

      - name: Verificar + reiniciar app
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" '
            set -euo pipefail
            echo "Migraciones aplicadas:"
            sqlite3 /var/www/wolfie-room/data/dev.db \
              "select migration_name from _prisma_migrations order by finished_at desc limit 5;"
            cd /var/www/wolfie-room
            pm2 startOrRestart deploy/ecosystem.config.js >/dev/null || true
            pm2 save >/dev/null 2>&1 || true
            sleep 3
            curl -s -o /dev/null -w "home=%{http_code}\n" http://127.0.0.1:3000/ || echo "home=000"
          '
