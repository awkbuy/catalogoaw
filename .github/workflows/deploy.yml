name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Create schema (valida la migración baseline)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          DATABASE_URL: "file:./ci.db"

      - name: Assemble standalone bundle
        run: bash deploy/assemble.sh

      # ─────────────────────────────────────────────────────────────
      # GATE DE PRUEBAS: no se despliega si falla la suite funcional
      # o la suite de seguridad. Ambos gates abortan el job (fail-fast)
      # antes de cualquier paso de SSH/rsync hacia producción.
      # ─────────────────────────────────────────────────────────────
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Seed CI database (datos de prueba para la suite funcional)
        run: npx prisma db seed
        env:
          DATABASE_URL: "file:./ci.db"
          ADMIN_PASSWORD: "admin123"

      - name: Gate funcional (Playwright E2E contra dev server)
        run: npx playwright test
        env:
          DATABASE_URL: "file:./ci.db"
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Gate de seguridad (batería E2E de ataque, 69 tests)
        run: npx playwright test --config=playwright.security.config.ts
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}

      - name: Upload Playwright artifacts (error-context + traces, solo si falla)
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 5
          if-no-files-found: ignore

      - name: Prepare SSH key
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_SSH_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Pre-deploy backup (en el VPS)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" 'bash /usr/local/bin/backup-wolfie.sh'

      - name: Sync config de deploy (scripts, ecosystem, nginx, env example)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_SSH_PORT -o StrictHostKeyChecking=no" \
            deploy/ "$VPS_USER@$VPS_HOST:/var/www/wolfie-room/deploy/"

      - name: Sync prisma (schema + migraciones)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_SSH_PORT -o StrictHostKeyChecking=no" \
            prisma/ "$VPS_USER@$VPS_HOST:/var/www/wolfie-room/prisma/"

      - name: Deploy release versionado (rsync a releases/<sha>)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" "mkdir -p /var/www/wolfie-room/releases/$SHA"
          rsync -avz --delete --exclude='public/uploads/' \
            -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_SSH_PORT -o StrictHostKeyChecking=no" \
            dist/app/ "$VPS_USER@$VPS_HOST:/var/www/wolfie-room/releases/$SHA/"

      - name: Swap symlink, restart, smoke test (rollback automático)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse --short HEAD)"
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" "bash /var/www/wolfie-room/deploy/remote-deploy.sh $SHA"

      - name: Verify (estado final)
        if: ${{ env.VPS_HOST != '' && env.VPS_USER != '' && env.VPS_SSH_KEY != '' && env.VPS_SSH_PORT != '' }}
        run: |
          ssh -p "$VPS_SSH_PORT" -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "$VPS_USER@$VPS_HOST" '
            cd /var/www/wolfie-room
            echo "app -> $(readlink app)"
            pm2 status wolfie-room
            echo "releases:"; ls -1 releases
          '
