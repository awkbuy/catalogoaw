name: Build and Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Create schema (valida la migración baseline)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          DATABASE_URL: "file:./ci.db"

      - name: Assemble standalone bundle
        run: |
          set -euo pipefail
          mkdir -p dist/app
          cp -r .next/standalone/. dist/app/
          cp -r .next/static dist/app/.next/static
          cp -r public/. dist/app/public/
          # better-sqlite3 resuelve su binario nativo desde prebuilds/ en runtime.
          # Next no lo incluye en el traceado del standalone: hay que copiarlo.
          mkdir -p dist/app/node_modules/better-sqlite3
          cp -r node_modules/better-sqlite3/prebuilds dist/app/node_modules/better-sqlite3/prebuilds
          du -sh dist/app

      - name: Prepare SSH key
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          cat ~/.ssh/known_hosts | tail -1

      - name: Deploy app bundle (rsync, preserva uploads)
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          rsync -avz --delete --exclude='public/uploads/' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            dist/app/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wolfie-room/app/"

      - name: Deploy prisma (schema + migraciones)
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            prisma/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wolfie-room/prisma/"

      - name: Deploy config (ecosystem, nginx, env example)
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no" \
            deploy/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/wolfie-room/deploy/"

      - name: Restart app
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_USER != '' && secrets.VPS_SSH_KEY != '' }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" '
            set -e
            mkdir -p /var/www/wolfie-room/app/public/uploads
            cd /var/www/wolfie-room
            pm2 startOrReload deploy/ecosystem.config.js
            pm2 save
            pm2 status wolfie-room
          '
