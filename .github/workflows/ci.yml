name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Create schema (valida la migración baseline)
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Build (standalone)
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          DATABASE_URL: "file:./ci.db"

      - name: Assemble standalone bundle
        run: bash deploy/assemble.sh

      - name: Smoke test standalone (/, /login)
        run: |
          set -euo pipefail
          export DATABASE_URL="file:/tmp/ci-smoke.db"
          export SESSION_SECRET="ci-smoke-secret"
          export ALLOW_SINGLE_TENANT="true"
          npx prisma migrate deploy
          cd dist/app
          nohup env PORT=3199 HOSTNAME=127.0.0.1 node server.js >/tmp/smoke.log 2>&1 &
          APP_PID=$!
          trap 'kill $APP_PID 2>/dev/null || true' EXIT
          cd ../..
          OK=0
          for i in $(seq 1 15); do
            sleep 2
            HOME_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3199/ || true)
            LOGIN_CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:3199/login || true)
            if [ "$HOME_CODE" = "200" ] && [ "$LOGIN_CODE" = "200" ]; then
              OK=1
              echo "SMOKE OK /=$HOME_CODE /login=$LOGIN_CODE"
              break
            fi
          done
          if [ "$OK" != "1" ]; then
            echo "SMOKE FALLÓ /=$HOME_CODE /login=$LOGIN_CODE"
            tail -50 /tmp/smoke.log
            exit 1
          fi
