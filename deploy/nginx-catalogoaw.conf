# Plataforma SaaS — proxy reverso a Next.js standalone (127.0.0.1:3000)
# Copiar a /etc/nginx/sites-available/catalogoaw y habilitar:
#   ln -s /etc/nginx/sites-available/catalogoaw /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# Para multi-tenant con subdominios: usar Caddy (Fase 6) que gestiona
# TLS automáticamente para cada *.tudominio.com.
# Este nginx es para arrancar mientras tanto.

server {
    listen 80;
    listen [::]:80;
    server_name tudominio.com *.tudominio.com;

    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
