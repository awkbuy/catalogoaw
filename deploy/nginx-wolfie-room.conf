# Wolfie Room — proxy reverso a Next.js standalone (127.0.0.1:3000)
# Copiar a /etc/nginx/sites-available/wolfie-room y habilitar:
#   ln -s /etc/nginx/sites-available/wolfie-room /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Luego: certbot --nginx -d wolfieroom.com.ar -d www.wolfieroom.com.ar

server {
    listen 80;
    listen [::]:80;
    server_name wolfieroom.com.ar www.wolfieroom.com.ar;

    client_max_body_size 10M;

    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
